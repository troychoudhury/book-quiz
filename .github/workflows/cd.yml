name: CD — Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Run CI First ────────────────────────────────────────────────
  ci-gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build & Push Docker Images ──────────────────────────────────
  build:
    name: Build & Push Docker Images
    needs: ci-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Database Migrations ─────────────────────────────────────────
  migrate:
    name: Run Database Migrations
    needs: [build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install alembic psycopg2-binary
          alembic upgrade head

  # ── Deploy to Fly.io ────────────────────────────────────────────
  deploy:
    name: Deploy to Fly.io
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Health Check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://${{ vars.APP_URL }}/api/v1/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting... attempt $i/10 (got $STATUS)"
            sleep 6
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

  # ── Smoke Tests ─────────────────────────────────────────────────
  smoke:
    name: Post-Deploy Smoke Tests
    needs: [deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Run smoke tests
        run: |
          BASE="${{ vars.APP_URL }}"
          echo "Testing $BASE..."

          # Health check
          curl -fsS "$BASE/api/v1/health" | jq .status

          # Book search
          curl -fsS "$BASE/api/v1/books?q=harry" | jq '.items | length'

          echo "✅ Smoke tests passed"
