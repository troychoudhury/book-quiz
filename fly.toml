app = "book-quiz"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.flyio"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/v1/health"
    protocol = "http"

[env]
  ENVIRONMENT = "production"
  DATABASE_URL = ""  # Set via `fly secrets set DATABASE_URL=...`
  REDIS_URL = ""     # Set via `fly secrets set REDIS_URL=...`
  JWT_SECRET_KEY = "" # Set via `fly secrets set JWT_SECRET_KEY=...`
  OPENAI_API_KEY = "" # Set via `fly secrets set OPENAI_API_KEY=...`

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  worker = "celery -A app.worker worker --loglevel=info --concurrency 2"
